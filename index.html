    </div>
  </section>

  <!-- 10. Tim -->
  <section class="sec team" id="tim" aria-labelledby="team-h">
    <div class="wrap">
      <header class="sec-head center"><p class="kicker" data-t="team.kicker"></p><h2 id="team-h" class="h2 split" data-t="team.title"></h2></header>
      <ul class="team-row hscroll" tabindex="0" aria-labelledby="team-h"></ul>
    </div>
  </section>

  <!-- 11. Recenzije -->
  <section class="sec reviews" id="recenzije" aria-labelledby="rev-h">
    <div class="wrap">
      <header class="sec-head"><p class="kicker" data-t="reviews.kicker"></p><h2 id="rev-h" class="h2 split" data-t="reviews.title"></h2><p class="sub note" data-t="reviews.note"></p></header>
      <figure class="rev-feature reveal"></figure>
      <ul class="rev-row hscroll" tabindex="0" aria-labelledby="rev-h"></ul>
      <p class="center-x"><a class="btn btn-ghost" target="_blank" rel="noopener" data-href="googleReview"><svg class="ic"><use href="#i-star"/></svg><span data-t="reviews.google"></span></a></p>
    </div>
  </section>

  <!-- 12. Njega -->
  <section class="sec care" id="njega" aria-labelledby="care-h">
    <div class="wrap">
      <header class="sec-head"><p class="kicker" data-t="care.kicker"></p><h2 id="care-h" class="h2 split" data-t="care.title"></h2></header>
      <ul class="tips hscroll" tabindex="0" aria-labelledby="care-h"></ul>
      <div class="care-grid">
        <div class="card quiz" id="kviz"></div>
        <div class="card calc" id="korekcija">
          <span class="calc-ic" aria-hidden="true"><svg class="ic"><use href="#i-cal"/></svg></span>
          <h3 class="h3" data-t="care.calc.title"></h3>
          <p class="calc-tip" data-t="care.calc.tip"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 13. Vjernost i poklon bon -->
  <section class="sec perks" id="poklon" aria-labelledby="gift-h">
    <div class="wrap">
      <div class="card gift">
        <div class="gift-head"><p class="kicker" data-t="gift.kicker"></p><h2 id="gift-h" class="h2 split" data-t="gift.title"></h2><p class="sub" data-t="gift.sub"></p></div>
        <div class="gift-card" aria-live="polite"></div>
        <div class="gift-form">
          <div class="ctl"><p class="ctl-label" data-t="gift.amount"></p><div class="seg gift-amounts" role="radiogroup"></div></div>
          <label class="field"><span data-t="gift.to"></span><input type="text" class="gift-to" maxlength="28" autocomplete="off"></label>
          <label class="field"><span data-t="gift.msg"></span><input type="text" class="gift-msg" maxlength="48" autocomplete="off"></label>
          <div class="ctl"><p class="ctl-label" data-t="gift.design"></p><div class="seg gift-designs" role="radiogroup"></div></div>
          <button type="button" class="btn btn-plum btn-lg gloss btn-block" data-gift="buy"><svg class="ic"><use href="#i-gift"/></svg><span data-t="gift.buy"></span></button><p class="note" data-t="gift.note"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 14. FAQ -->
  <section class="sec faq" id="faq" aria-labelledby="faq-h">
    <div class="wrap faq-grid">
      <header class="sec-head"><p class="kicker" data-t="faq.kicker"></p><h2 id="faq-h" class="h2 split" data-t="faq.title"></h2></header>
      <div class="faq-list"></div>
    </div>
  </section>

  <!-- 15. Kontakt -->
  <section class="sec contact" id="kontakt" aria-labelledby="ct-h">
    <div class="wrap contact-grid">
      <div>
        <header class="sec-head"><p class="kicker" data-t="contact.kicker"></p><h2 id="ct-h" class="h2 split" data-t="contact.title"></h2></header>
        <dl class="ct-info"></dl>
        <div class="row-btns ct-btns"></div>
      </div>
      <div class="map card" aria-hidden="true"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-grid">
    <div><p class="foot-brand"><span class="brand-mark" aria-hidden="true"></span><span data-salon="name"></span></p><p class="foot-slogan"></p></div>
    <div class="foot-links"></div>
    <div class="foot-meta"><p class="small" data-t="footer.privacy"></p><p class="small" data-t="footer.demo"></p><p class="small foot-copy"></p></div>
  </div>
</footer>

<!-- donja navigacija (mobitel) -->
<nav class="tabbar" data-ta="a11y.nav">
  <a href="#top" data-tab="home"><svg class="ic"><use href="#i-home"/></svg><span data-t="nav.home"></span></a>
  <a href="#usluge" data-tab="services"><svg class="ic"><use href="#i-list"/></svg><span data-t="nav.services"></span></a>
  <a href="#isprobaj" data-tab="tryon"><svg class="ic"><use href="#i-brush"/></svg><span data-t="nav.tryon"></span></a>
  <button type="button" data-tab="favs" data-open-favs><svg class="ic"><use href="#i-heart"/></svg><span data-t="nav.favs"></span><b class="badge fav-count" hidden></b></button>
  <button type="button" data-tab="book" data-open-booking><svg class="ic"><use href="#i-cal"/></svg><span data-t="nav.book"></span><b class="badge cart-count" hidden></b></button>
  <span class="tab-ind" aria-hidden="true"></span>
</nav>
<button type="button" class="fab gloss" data-open-booking><svg class="ic"><use href="#i-cal"/></svg><span class="fab-t"></span><b class="badge cart-count" hidden></b></button>

<!-- sheet (zakazivanje, omiljeni, galerija) -->
<div class="scrim" hidden></div>
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grab" aria-hidden="true"><i></i></div>
  <div class="sheet-head"><button type="button" class="icon-round sheet-back" data-ta="a11y.back" hidden><svg class="ic"><use href="#i-back"/></svg></button><h2 id="sheet-title" class="h3"></h2><button type="button" class="icon-round sheet-close" aria-label="Zatvori"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="sheet-body"></div>
  <div class="sheet-foot"></div>
</div>

<div class="toast" role="status" aria-live="polite"></div>
<div class="cursor-drop" aria-hidden="true"></div>
<noscript><p style="padding:20px">Za isprobavanje boje i zakazivanje uključi JavaScript.</p></noscript>
</body>
